name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Language-ID model (public fastText file, < 1 MB)
        run: curl -fL -o models/lid.176.ftz https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz
      - name: API-key scan (the project is keyless by design)
        run: python scripts/check_no_keys.py
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type-check engine
        run: mypy
      - name: Tests (offline)
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Type-check and build the dashboard
        run: cd src/web && npm ci && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentinel:ci .
      - name: Smoke test - container serves health within 90 s
        run: |
          docker run -d -p 8000:8000 --name s sentinel:ci
          for i in $(seq 1 45); do curl -fs localhost:8000/v1/health && exit 0; sleep 2; done
          docker logs s; exit 1
