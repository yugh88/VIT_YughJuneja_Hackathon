[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: a keyless, multilingual risk-signal engine with an index rebalancer and a bank-book stress tester."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
include = ["engine*", "modules*", "training*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["engine"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["network: test needs internet (skipped by default in CI)", "slow: minutes-long end-to-end replay (make test-all)"]
addopts = "-q -m 'not network and not slow'"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
