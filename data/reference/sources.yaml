# Keyless ingestion sources. Every entry has a recorded replay twin in data/replay/<name>/.
# `kind` selects the connector class; other keys are passed to its constructor.
# `live: false` keeps a source replay-only even in live mode (e.g. it needs auth or is a dataset).

gdelt_gkg:
  kind: gdelt_gkg
  poll_interval_s: 300          # GDELT publishes every 15 min; polling faster just re-reads the manifest
  translation: true             # also read the machine-translated stream (65 languages)
  max_docs_per_file: 600

gdelt_doc:
  kind: gdelt_doc
  replay_covered_by: gdelt_gkg  # the DOC API rate-limits (429) heavily; GKG/Events files carry the same articles
  poll_interval_s: 900          # GDELT asks for <= 1 request / 5 s
  timespan: 30min
  queries:
    - "theme:ECON_STOCKMARKET"
    - "(downgrade OR default OR bankruptcy OR \"credit rating\")"
    - "(sanctions OR tariff OR invasion) theme:ECON_TRADE"
    - "theme:ECON_CENTRALBANK"

